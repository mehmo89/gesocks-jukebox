<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesocks Jukebox</title>
<style>
  :root{
    --ink:#1a1a1a; --paper:#f3ecdd; --paper2:#f8f4ea; --rot:#d8352b; --rot-d:#b81e18;
    --muted:#7a7268;
    --hd1:255px 12px 225px 15px/15px 225px 15px 255px;
    --hd2:15px 225px 15px 255px/255px 12px 225px 15px;
    --font:'Chalkboard SE','Marker Felt','Comic Sans MS','Segoe Print',cursive;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#ddd6c6;font-family:var(--font);color:var(--ink);
       display:flex;justify-content:center;padding:16px;}
  .app{width:100%;max-width:760px;height:100%;max-height:92vh;display:flex;flex-direction:column;
       background:var(--paper);border:3px solid var(--ink);border-radius:14px;
       box-shadow:6px 7px 0 rgba(0,0,0,.22);overflow:hidden;}

  .hd{padding:16px 20px 12px;flex:0 0 auto;border-bottom:3px solid var(--ink);background:var(--paper);}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand h1{margin:0;font-size:30px;line-height:.95;transform:rotate(-1.2deg);}
  .brand h1 em{color:var(--rot);font-style:normal;}
  .brand .sub{display:block;font-size:12px;letter-spacing:1.5px;color:var(--muted);transform:rotate(-.6deg);margin-top:2px;}
  .stat{font-size:13px;color:var(--muted);margin:12px 0 10px;}
  .stat b{color:var(--ink);}
  .stat .prog{color:var(--rot);}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .search{flex:1;min-width:180px;}
  .search input{width:100%;font-family:var(--font);font-size:15px;padding:9px 14px;background:var(--paper2);
    border:3px solid var(--ink);border-radius:var(--hd1);color:var(--ink);outline:none;}
  .search input::placeholder{color:#a79e8f;}
  .search input:focus{box-shadow:0 0 0 3px rgba(216,53,43,.3);}
  .tabs{display:flex;gap:8px;}
  .tab{font-family:var(--font);font-size:14px;padding:8px 15px;background:var(--paper2);
    border:3px solid var(--ink);border-radius:var(--hd2);cursor:pointer;color:var(--ink);}
  .tab:nth-child(2){border-radius:var(--hd1);}
  .tab:hover{background:#ece3d0;}
  .tab.on{background:var(--rot);color:#fff;}
  .tab:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(216,53,43,.35);}

  .listwrap{flex:1 1 auto;overflow-y:auto;padding:4px 14px 10px;}
  .listwrap::-webkit-scrollbar{width:10px}
  .listwrap::-webkit-scrollbar-thumb{background:#cfc6b2;border-radius:5px;border:2px solid var(--paper);}
  .seth{font-size:16px;margin:12px 4px 6px;}
  .row{display:grid;grid-template-columns:52px 30px 1fr;align-items:center;gap:12px;
       padding:9px 10px;border-radius:var(--hd1);cursor:default;border:2px solid transparent;}
  .row + .row{margin-top:2px;}
  .row:hover:not(.active){background:var(--rot);color:#fff;border-color:var(--ink);}
  .row.extern{opacity:.72;}
  .row.extern:hover{opacity:1;}
  /* active (currently playing): red text + red icons on the light paper background */
  .row.active{background:var(--paper2);color:var(--rot);border-color:var(--rot);}
  .row.active .artist,.row.active .sid{color:var(--rot);}
  .row.active .tag{border-color:var(--rot);color:var(--rot);}
  /* hover on a NON-active row: red fill, white text + white icons */
  .row:hover:not(.active) .artist,.row:hover:not(.active) .sid{color:#fff;}
  .row:hover:not(.active) .tag{border-color:#fff;color:#fff;}
  .row:hover:not(.active) .note span,.row:hover:not(.active) .artist span{color:#fff!important;}

  .pbtn{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--paper2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);padding:0;}
  .pbtn:hover{background:#ece3d0;}
  .pbtn.play{background:var(--rot);color:#fff;}
  .pbtn.play:hover{background:var(--rot-d);}
  /* active/playing song: red circle, white icon; only the circle's BORDER changes */
  .row.active .pbtn.play{background:var(--rot);color:#fff;border-color:var(--rot);}
  /* hover on a NON-active row -> white play button with red icon */
  .row:hover:not(.active) .pbtn{background:#fff;color:var(--rot);border-color:var(--ink);}
  .row:hover:not(.active) .pbtn.play{background:#fff;color:var(--rot);border-color:var(--ink);}
  .row:hover:not(.active) .num{color:#fff;}
  .pbtn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(216,53,43,.4);}
  .pbtn svg{width:20px;height:20px;fill:currentColor;}

  .num{font-size:19px;font-weight:700;text-align:center;}
  .meta{min-width:0;}
  .title{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.15;}
  .title .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .tag{font-size:10px;letter-spacing:.5px;padding:1px 7px;border:2px solid var(--ink);border-radius:var(--hd2);
    color:var(--muted);white-space:nowrap;}
  .tag.ki{color:var(--rot);border-color:var(--rot);}
  .artist{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sid{color:#b3a894;}

  .right{display:flex;align-items:center;gap:10px;justify-self:end;}
  .ext{font-size:12px;color:var(--rot);text-decoration:none;border-bottom:2px solid var(--rot);
    padding-bottom:1px;white-space:nowrap;}
  .row.active .ext{color:var(--rot);border-color:var(--rot);}
  .row:hover:not(.active) .ext{color:#fff;border-color:#fff;}
  .ext:hover{color:var(--rot-d);}
  .stars{display:flex;gap:3px;}
  .star{width:30px;height:30px;font-family:var(--font);font-size:13px;cursor:pointer;padding:0;
    border:2px solid var(--ink);background:var(--paper2);color:var(--ink);border-radius:var(--hd2);}
  .star:nth-child(odd){border-radius:var(--hd1);}
  .star.sel{background:var(--rot);color:#fff;border-color:var(--ink);}
  .star.hv{background:#f2c9c5;}
  .row.active .star{background:#fff;color:var(--ink);}
  .row.active .star.sel{background:#1a1a1a;color:#fff;}
  .star:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(216,53,43,.4);}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:16px;}
  .ytbtn{font-family:var(--font);font-size:12px;cursor:pointer;color:var(--ink);background:var(--paper2);
    border:2px solid var(--ink);border-radius:var(--hd2);padding:4px 9px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:4px;}
  .ytbtn:hover{background:var(--rot);color:#fff;border-color:var(--rot);}
  /* share + fcsp link buttons — same look as the YouTube button: black default, red on hover */
  .shr,.fcsp{font-family:var(--font);font-size:12px;cursor:pointer;color:var(--ink);background:var(--paper2);
    border:2px solid var(--ink);border-radius:var(--hd2);padding:4px 9px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
  .shr:hover,.fcsp:hover{background:var(--rot);color:#fff;border-color:var(--rot);}
  .shr.ok{background:var(--rot);color:#fff;border-color:var(--rot);}
  /* active/playing row: buttons go red (border + text/icon) to match the red row text */
  .row.active .shr,.row.active .fcsp,.row.active .ytbtn{color:var(--rot);border-color:var(--rot);background:var(--paper2);}
  .row.active .shr:hover,.row.active .fcsp:hover,.row.active .ytbtn:hover{background:var(--rot);color:#fff;border-color:var(--rot);}
  /* hover on a NON-active row (red background): white border + white text so they stand out */
  .row:hover:not(.active) .shr,.row:hover:not(.active) .fcsp,.row:hover:not(.active) .ytbtn{
    color:#fff;border-color:#fff;background:transparent;}
  .row:hover:not(.active) .shr:hover,.row:hover:not(.active) .fcsp:hover,.row:hover:not(.active) .ytbtn:hover{
    background:#fff;color:var(--rot);border-color:#fff;}
  /* control button bar (replaces the order dropdown + KI tabs) */
  .btnbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btnbar button{font-family:var(--font);font-size:14px;padding:8px 15px;background:var(--paper2);
    border:3px solid var(--ink);border-radius:var(--hd2);cursor:pointer;color:var(--ink);}
  .btnbar button:nth-child(2n){border-radius:var(--hd1);}
  .btnbar button:hover{background:#ece3d0;}
  .btnbar button.on{background:var(--rot);color:#fff;}
  .btnbar button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(216,53,43,.35);}
  .ytslot:empty{display:none;}
  .ytbox{margin:10px 0 2px;border:3px solid var(--ink);border-radius:8px;overflow:hidden;background:#000;width:320px;max-width:100%;}
  .ytbox iframe{display:block;width:320px;max-width:100%;height:180px;border:0;}
  .ythint{font-size:12px;color:#fff;background:#1a1a1a;padding:5px 9px;cursor:pointer;}
  .row.active .ytslot .ext{color:#fff;border-color:#fff;}

  .player{flex:0 0 auto;border-top:3px solid var(--ink);background:var(--paper2);padding:12px 20px 14px;}
  .np{display:flex;align-items:center;gap:14px;}
  .np .thumb{width:42px;height:48px;flex:0 0 auto;}
  .np .info{min-width:0;flex:1;}
  .np .lab{font-size:12px;color:var(--rot);}
  .np .nt{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .np .na{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* overflow "···" menu in the player row: Weiterfunken / Kiek mol / YouTube as text items */
  .more{position:relative;flex:0 0 auto;align-self:center;}
  .morebtn{font-family:var(--font);font-size:18px;line-height:1;cursor:pointer;color:var(--muted);
    background:transparent;border:0;border-radius:6px;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;}
  .morebtn:hover{background:transparent;color:var(--rot);}
  .morebtn[hidden]{display:none;}
  .menu{position:absolute;right:0;bottom:calc(100% + 8px);min-width:170px;z-index:20;
    background:var(--paper2);border:3px solid var(--ink);border-radius:10px;
    box-shadow:4px 5px 0 rgba(0,0,0,.2);padding:6px;display:flex;flex-direction:column;gap:4px;}
  .menu[hidden]{display:none;}
  .mitem{font-family:var(--font);font-size:15px;text-align:left;cursor:pointer;color:var(--ink);
    background:transparent;border:0;border-radius:7px;padding:9px 12px;white-space:nowrap;text-decoration:none;display:block;}
  .mitem:hover{background:var(--rot);color:#fff;}
  .mitem[hidden]{display:none;}
  .scrub{display:flex;align-items:center;gap:10px;margin:8px 0 10px;}
  .scrub .time{font-size:12px;color:var(--muted);width:34px;}
  .track{flex:1;height:16px;border:3px solid var(--ink);border-radius:var(--hd1);padding:2px;cursor:pointer;}
  .track>i{display:block;height:100%;width:0%;background:var(--rot);border-radius:6px;}
  .tp{display:flex;align-items:center;justify-content:center;gap:22px;}
  .tp button{font-family:var(--font);border:3px solid var(--ink);background:var(--paper2);cursor:pointer;color:var(--ink);}
  .tp .rnd{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;}
  .tp .rnd:hover{background:#ece3d0;}
  .tp .big{width:64px;height:64px;background:var(--rot);color:#fff;}
  .tp .big:hover{background:var(--rot-d);}
  .tp .rnd svg{width:22px;height:22px;fill:currentColor;}
  .tp .tog{font-size:14px;padding:8px 16px;border-radius:999px;}
  .tp .tog.on{background:var(--rot);color:#fff;}
  .tp button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(216,53,43,.4);}

  @media (prefers-reduced-motion: no-preference){
    .row,.pbtn,.tab,.btnbar button,.star,.tp button{transition:background .12s ease, opacity .12s ease, box-shadow .12s ease;}
  }
  @media(max-width:560px){ .brand h1{font-size:24px} }

  /* ---------- responsive: full-bleed phone layout + sticky mobile player ---------- */
  @media (max-width:640px){
    body{padding:0;background:var(--paper);}
    .app{max-width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none;}
    .hd{padding:12px 14px 8px;padding-top:max(12px, env(safe-area-inset-top));flex:0 0 auto;}
    .brand{gap:10px;}
    .brand h1{font-size:24px;}
    .brand .sub{font-size:11px;}
    .stat{font-size:11.5px;margin:8px 0 7px;}
    .controls{gap:7px;}
    .search{min-width:0;flex:1 1 100%;order:1;}
    .search input{font-size:15px;padding:9px 13px;}
    .btnbar{order:2;flex-wrap:wrap;gap:6px;}
    .btnbar button{padding:8px 13px;font-size:13px;flex:0 0 auto;}
    /* list takes the remaining height so several songs are visible */
    .listwrap{flex:1 1 auto;min-height:0;padding:4px 12px 8px;}
    .seth{margin:10px 2px 6px;font-size:15px;}
    /* song row: play on the left, title+artist on the right */
    .row{grid-template-columns:48px 1fr;grid-template-areas:"play meta";
         gap:4px 12px;padding:9px 8px;align-items:center;}
    .row .pbtn{grid-area:play;align-self:center;}
    .num{display:none;}
    .meta{grid-area:meta;min-width:0;}
    .title{font-size:15px;}
    .artist{font-size:12px;}
    /* bigger tap targets (Apple HIG >=44px) */
    .pbtn{width:46px;height:46px;}
    /* player action buttons (now in the player bar) — keep labels, size for touch */
    /* overflow menu button fits the compact mobile player */
    .morebtn{width:44px;height:44px;font-size:19px;}
    .menu{min-width:160px;}
    /* fluid YouTube pane — never overflow */
    .ytbox{width:100%;}
    .ytbox iframe{width:100%;height:auto;aspect-ratio:16/9;}
    /* compact player bar, thumb-reachable, clear of the home indicator */
    .player{flex:0 0 auto;padding:8px 14px calc(8px + env(safe-area-inset-bottom));}
    .np{gap:10px;}
    .np .thumb{width:34px;height:40px;}
    .np .nt{font-size:15px;}
    .np .na{font-size:12px;}
    .np .lab{font-size:11px;}
    .scrub{margin:6px 0 7px;}
    .tp{gap:12px;}
    .tp .rnd{width:44px;height:44px;}
    .tp .big{width:56px;height:56px;}
    .tp .tog{padding:8px 11px;font-size:12px;}
  }
  /* small-phone: let the mode toggles wrap under the transport */
  @media (max-width:380px){
    .brand h1{font-size:22px;}
    .tp{flex-wrap:wrap;gap:10px 12px;}
    .tp .tog{order:3;}
  }

</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <div class="brand">
      <svg class="thumb" width="34" height="44" viewBox="0 0 120 160" aria-label="Müdes Gesocks">
        <path d="M50 8 Q78 6 80 44 L80 120 Q80 150 55 150 Q30 150 30 120 L30 70 Q18 60 24 40 Q30 18 50 8 Z" fill="#f8f4ea" stroke="#1a1a1a" stroke-width="5"></path>
        <rect x="30" y="120" width="50" height="30" rx="3" fill="#f8f4ea" stroke="#1a1a1a" stroke-width="5"></rect>
        <rect x="31" y="128" width="48" height="7" fill="#d8352b"></rect><rect x="31" y="140" width="48" height="7" fill="#d8352b"></rect>
        <circle cx="40" cy="42" r="9" fill="none" stroke="#1a1a1a" stroke-width="3"></circle><circle cx="63" cy="40" r="9" fill="none" stroke="#1a1a1a" stroke-width="3"></circle>
        <path d="M36 42 l8 0 M40 38 l0 8 M59 40 l8 0 M63 36 l0 8" stroke="#1a1a1a" stroke-width="2.5"></path>
        <path d="M30 68 Q46 78 60 64" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"></path>
      </svg>
      <div><h1>Gesocks <em>Jukebox</em></h1><span class="sub">~ müdes gesocks fcsp · st. pauli song contest ~</span></div>
    </div>
    <div class="stat"><b>363 Songs</b> · <b>286</b> direkt · <b>55</b> Vorschau · <b>22</b> extern</div>
    <div class="controls">
      <div class="search"><input id="q" type="search" placeholder="Suche Titel oder Interpret…" aria-label="Suche"></div>
      <div class="btnbar">
        <button class="tog on" id="shufOrder" title="Reihenfolge mischen">Zufall</button>
        <button class="filt on" id="fNeu" title="Neu erstellte Songs (2. Release)">Neu</button>
        <button class="filt on" id="fBest" title="Bereits bestehende Songs (1. Release)">Bestehend</button>
        <button class="tog on" id="kiTog" title="KI-Songs einschließen (aus = nur ohne KI)">mit KI</button>
      </div>
    </div>
  </div>

  <div class="listwrap">
    <div class="seth">★ setlist</div>
    <div id="list"></div>
  </div>

  <div class="player">
    <div class="np">
      <svg class="thumb" viewBox="0 0 120 160" aria-hidden="true">
        <path d="M50 8 Q78 6 80 44 L80 120 Q80 150 55 150 Q30 150 30 120 L30 70 Q18 60 24 40 Q30 18 50 8 Z" fill="#f8f4ea" stroke="#1a1a1a" stroke-width="5"></path>
        <rect x="30" y="120" width="50" height="30" rx="3" fill="#f8f4ea" stroke="#1a1a1a" stroke-width="5"></rect>
        <rect x="31" y="128" width="48" height="7" fill="#d8352b"></rect><rect x="31" y="140" width="48" height="7" fill="#d8352b"></rect>
        <circle cx="40" cy="42" r="9" fill="none" stroke="#1a1a1a" stroke-width="3"></circle><circle cx="63" cy="40" r="9" fill="none" stroke="#1a1a1a" stroke-width="3"></circle>
      </svg>
      <div class="info">
        <div class="nt"><span id="npt">— nichts ausgewählt —</span></div>
        <div class="na" id="npa"></div>
      </div>
      <div class="more">
        <button class="morebtn" id="moreBtn" title="Aktionen" aria-label="Aktionen" aria-haspopup="true" aria-expanded="false">···</button>
        <div class="menu" id="actMenu" role="menu" hidden>
          <button class="mitem" id="pShr" role="menuitem">Weiterfunken</button>
          <a class="mitem" id="pFcsp" role="menuitem" target="_blank" rel="noopener">Kiek mol</a>
          <button class="mitem" id="pYt" role="menuitem" hidden>YouTube</button>
        </div>
      </div>
    </div>
    <div class="scrub">
      <span class="time" id="cur">0:00</span>
      <div class="track" id="track"><i id="fill"></i></div>
      <span class="time" id="dur" style="text-align:right">0:00</span>
    </div>
    <div class="tp">
      <button class="tog on" id="auto">↻ Autoplay</button>
      <button class="rnd" id="prev" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg></button>
      <button class="rnd big" id="pp" aria-label="Play/Pause"></button>
      <button class="rnd" id="next" aria-label="Weiter"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"></path></svg></button>
      <button class="tog" id="shuf">» Shuffle</button>
    </div>
  </div>
</div>
<audio id="audio" preload="none"></audio>

<script>
  const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  const PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
  const EXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 17L17 7M9 7h8v8"/></svg>';
  // Lucide icons (MIT), thin stroke + currentColor so they match the transport icons
  const ICON_SHARE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px"><path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"/><path d="M8 6v8"/></svg>';
  const ICON_ANCHOR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px"><path d="M12 6v16"/><path d="m19 13 2-1a9 9 0 0 1-18 0l2 1"/><path d="M9 11h6"/><circle cx="12" cy="4" r="2"/></svg>';

": ""}, {"t": "Sankt Pauli Loves You", "a": "Peter Bachmann", "id": "K0039", "ki": true, "rel": 2, "ord": 355, "fcsp": "https://www.fcstpauli.com/spsc/der-st-pauli-song-contest-deine-stimme-wird-gebraucht/k0039", "audio": "https://api.fcstpauli.com/uploads/audio/SPSC_mit-KI/K0039_Sankt-Pauli-Loves-You_Peter-Bachmann.mp3?v=1792164427", "prev": "", "yt": "", "ext": ""}, {"t": "Hoch im Norden", "a": "Hü Schenkel Lite", "id": "K0040", "ki": true, "rel": 2, "ord": 356, "fcsp": "https://www.fcstpauli.com/spsc/der-st-pauli-song-contest-deine-stimme-wird-gebraucht/k0040", "audio": "https://api.fcstpauli.com/uploads/audio/SPSC_mit-KI/K0040_Hoch-im-Norden_-Hu%CC%88-Schenkel-Lite.mp3?v=1792164421", "prev": "", "yt": "", "ext": ""}, {"t": "St. Pauli", "a": "Black Anchor Sounds", "id": "K0041", "ki": true, "rel": 2, "ord": 357, "fcsp": "https://www.fcstpauli.com/spsc/der-st-pauli-song-contest-deine-stimme-wird-gebraucht/k0041", "audio": "https://api.fcstpauli.com/uploads/audio/SPSC_mit-KI/K0041_St.-Pauli_Black-Anchor-Sounds.mp3?v=1792164415", "prev": "", "yt": "", "ext": ""}, {"t": "Run Fight St. Pauli", "a": "RoDJ", "id": "K0042", "ki": true, "rel": 2, "ord": 358, "fcsp": "https://www.fcstpauli.com/spsc/der-st-pauli-song-contest-deine-stimme-wird-gebraucht/k0042", "audio": "https://api.fcstpauli.com/uploads/audio/SPSC_mit-KI/K0042_Run-Fight-St.-Pauli_RoDJ.mp3?v=1792164411", "prev": "", "yt": "", "ext": ""}, {"t": "St. Pauli Herz und Seele", "a": "Lautere Absichten", "id": "K0043", "ki": true, "rel": 2, "ord": 359, "fcsp": "https://www.fcstpauli.com/spsc/der-st-pauli-song-contest-deine-stimme-wird-gebraucht/k0043", "audio": "https://api.fcstpauli.com/uploads/audio/SPSC_mit-KI/K0043_St.-Pauli-Herz-und-Seele_Lautere-Absichten.mp3?v=1792164408", "prev": "", "yt": "", "ext": ""}, {"t": "HellYeah FCSP", "a": "Oke Teuflisch", "id": "K0044", "ki": true, "rel": 2, "ord": 360, "fcsp": "https://www.fcstpauli.com/spsc/der-st-pauli-song-contest-deine-stimme-wird-gebraucht/k0044", "audio": "https://api.fcstpauli.com/uploads/audio/SPSC_mit-KI/K0044_HellYeah-FCSP_Oke-Teuflisch.mp3?v=1792164402", "prev": "", "yt": "", "ext": ""}, {"t": "Hamburgs wahre Nummer eins!", "a": "Sabiyana", "id": "K0045", "ki": true, "rel": 2, "ord": 361, "fcsp": "https://www.fcstpauli.com/spsc/der-st-pauli-song-contest-deine-stimme-wird-gebraucht/k0045", "audio": "https://api.fcstpauli.com/uploads/audio/SPSC_mit-KI/K0045_Hamburgs-wahre-Nummer-eins_Sabiyana.mp3?v=1792164397", "prev": "", "yt": "", "ext": ""}, {"t": "Viva", "a": "Green Machine", "id": "K0046", "ki": true, "rel": 2, "ord": 362, "fcsp": "https://www.fcstpauli.com/spsc/der-st-pauli-song-contest-deine-stimme-wird-gebraucht/k0046", "audio": "https://api.fcstpauli.com/uploads/audio/SPSC_mit-KI/K0046_Viva-Green-Machine.wav?v=1792164390", "prev": "", "yt": "", "ext": ""}];                // {t,a,id,ki,rel,ord,audio,prev,yt,ext}
  const TOTAL = songs.length;
  // FC St. Pauli SPSC link — verified per song at build time (real detail page,
  // or the release overview page when FCSP only links to YouTube). Never a guessed slug.
  function fcspUrl(s){ return s.fcsp || "https://www.fcstpauli.com/spsc/der-st-pauli-song-contest-deine-stimme-wird-gebraucht"; }
  // Public URL the jukebox is published under (GitHub Pages: mehmo89/gesocks-jukebox).
  // Used for share links when the page is opened locally (file://) — where
  // location.origin is "null" and a self-built link would be broken
  // (e.g. "null/Users/.../index.html?play=N0004").
  const PUBLIC_BASE = "https://mehmo89.github.io/gesocks-jukebox/";
  function shareUrl(s){
    let base;
    if(location.protocol === "http:" || location.protocol === "https:"){
      base = location.origin + location.pathname;           // served live -> share the real page URL
    } else {
      base = PUBLIC_BASE;                                    // file:// etc. -> use the published URL
    }
    return base + "?play=" + encodeURIComponent(s.id);
  }

  const audio = document.getElementById("audio");
  // Controls:
  //  shufOrder (toggle, default on)  -> random order vs FC St. Pauli website order
  //  inclKI    (toggle, default on) -> on = alle Songs (inkl. KI); off = KI-Songs raus (nur ohne KI)
  //  fNeu/fBest(filters)             -> both off OR both on = all; exactly one = that release
  let query="", shufOrder=true, inclKI=true, fNeu=true, fBest=true, cur=-1, autoplay=true, shuffle=false, ytOpen=-1;
  let orderIdx = randomOrder();          // array of song-indices, reshuffled when Zufall is (re)activated
  const $=s=>document.querySelector(s);

  function randomOrder(){
    const a = songs.map((_,i)=>i);
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  // base index order: random (fixed per activation) or FC St. Pauli website order ('ord')
  function buildOrder(){
    if(shufOrder) return orderIdx.slice();
    return songs.map((_,i)=>i).sort((x,y)=>songs[x].ord - songs[y].ord);
  }
  // release filter: both off OR both on = all; exactly one = that release (1=Bestehend, 2=Neu)
  function relAllowed(s){
    if(fNeu===fBest) return true;        // both off or both on
    return fNeu ? s.rel===2 : s.rel===1;
  }

  // native <audio> plays: full MP3 if present, else the 30s iTunes preview.
  function src(s){ return s.audio || s.prev; }
  function isPreview(s){ return !s.audio && !!s.prev; }
  function ytUrl(s){ return s.yt ? ("https://www.youtube.com/watch?v="+s.yt) : (s.ext||""); }

  function mmss(s){ if(!isFinite(s)) return "0:00"; return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"); }

  function visible(){
    const q=query.toLowerCase();
    return buildOrder().map(i=>({s:songs[i],i})).filter(({s})=>{
      if(!inclKI && s.ki) return false;            // "mit KI" aus -> KI-Songs raus
      if(!relAllowed(s)) return false;             // Neu / Bestehend release filter
      return !q||s.t.toLowerCase().includes(q)||s.a.toLowerCase().includes(q);
    });
  }
  function playableIdx(){ return visible().filter(({s})=>src(s)).map(({i})=>i); }

  function render(){
    const list=$("#list"); list.innerHTML="";
    const vis=visible();
    if(!vis.length){ list.innerHTML='<div class="empty">Nix gefunden, Deern. 🧦</div>'; return; }
    const playing = cur>=0 && !audio.paused;
    vis.forEach(({s,i}, pos)=>{
      const nativeOk = !!src(s);
      const row=document.createElement("div");
      row.className="row"+((!nativeOk)?" extern":"")+(i===cur?" active":"");
      const btn = nativeOk
        ? `<button class="pbtn play" data-play="${i}" aria-label="Abspielen">${(i===cur&&playing)?PAUSE:PLAY}</button>`
        : `<button class="pbtn" data-ext="${i}" aria-label="Extern öffnen">${EXT}</button>`;
      // note under the artist line
      let note="";
      if(isPreview(s)) note=` · <span style="color:var(--rot)">♪ 30s Vorschau</span>`;
      else if(!nativeOk) note=` · <span style="color:var(--rot)">nur extern</span>`;
      // setlist rows now show ONLY song details; actions live in the player bar below.
      row.innerHTML=`${btn}<div class="num">${pos+1}</div>
        <div class="meta"><div class="title"><span class="t">${s.t}</span>
          <span class="tag${s.ki?' ki':''}">${s.ki?'mit KI':'ohne KI'}</span></div>
          <div class="artist">${s.a} · <span class="sid">${s.id}</span>${note}</div>
          <div class="ytslot" id="ytslot-${i}"></div></div>`;
      list.appendChild(row);
    });
    if(ytOpen>=0){ const slot=document.getElementById("ytslot-"+ytOpen); if(slot) mountYouTube(ytOpen, slot); }
    bind();
  }

  function bind(){
    document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.play; (i===cur)?toggle():playSong(i); });
    document.querySelectorAll("[data-yt]").forEach(b=>b.onclick=()=>{ openYouTube(+b.dataset.yt); });
    document.querySelectorAll("[data-shr]").forEach(b=>b.onclick=()=>{ share(+b.dataset.shr, b); });
    document.querySelectorAll("[data-ext]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.ext; const s=songs[i];
      b.animate([{transform:'rotate(0)'},{transform:'rotate(12deg)'},{transform:'rotate(0)'}],{duration:220});
      if(s.yt){ openYouTube(i); return; }
      if(s.ext) window.open(s.ext,"_blank","noopener");
    });
  }

  // ---- native engine (full MP3s + iTunes previews) ----
  function playSong(i){ const s=songs[i]; const u=src(s); if(!u) return;
    closeYouTube();
    cur=i; audio.src=u;
    $("#npt").textContent=s.t;
    $("#npa").textContent=s.a+" · "+(s.ki?"mit KI":"ohne KI")+(isPreview(s)?" · 30s Vorschau":"");
    updatePlayerActions(i);
    audio.play().catch(()=>{}); render();
    scrollActiveIntoView();
  }

  // ---- player overflow menu (Weiterfunken / Kiek mol / YouTube) ----
  // Target = the current song, or (if none selected yet) the first playable/visible song.
  function menuTarget(){
    if(cur>=0) return cur;
    const pl=playableIdx(); if(pl.length) return pl[0];
    const vis=visible(); return vis.length ? vis[0].i : -1;
  }
  function updatePlayerActions(i){ /* kept for call sites; menu wires itself on open */ }
  function wireMenu(){
    const i=menuTarget(); if(i<0) return;
    const s=songs[i];
    $("#pShr").onclick=()=>{ share(i, $("#pShr")); closeMenu(); };
    const fc=$("#pFcsp"); fc.href=fcspUrl(s); fc.onclick=()=>closeMenu();
    const yt=$("#pYt");
    if(s.yt){ yt.hidden=false; yt.onclick=()=>{ openYouTube(i); closeMenu(); }; }
    else { yt.hidden=true; }
  }
  function openMenu(){ wireMenu(); $("#actMenu").hidden=false; $("#moreBtn").setAttribute("aria-expanded","true"); }
  function closeMenu(){ const m=$("#actMenu"); if(m) m.hidden=true; const b=$("#moreBtn"); if(b) b.setAttribute("aria-expanded","false"); }
  function toggleMenu(){ $("#actMenu").hidden ? openMenu() : closeMenu(); }
  // keep the currently playing row centered in the list so the user always sees where they are
  function scrollActiveIntoView(){
    requestAnimationFrame(()=>{
      const row=document.querySelector(".row.active");
      if(row) row.scrollIntoView({block:"center", behavior:"smooth"});
    });
  }
  function toggle(){ if(cur<0){ const l=playableIdx(); if(l.length) playSong(l[0]); return; }
    if(audio.paused) audio.play().catch(()=>{}); else audio.pause(); }
  function next(){ const l=playableIdx(); if(!l.length) return;
    if(shuffle){ if(l.length===1){ playSong(l[0]); return; } let r; do{ r=l[Math.floor(Math.random()*l.length)]; }while(r===cur); playSong(r); return; }
    const pos=l.indexOf(cur); playSong(pos===-1?l[0]:l[(pos+1)%l.length]); }
  function prev(){ const l=playableIdx(); if(!l.length) return;
    const pos=l.indexOf(cur); playSong(pos===-1?l[0]:l[(pos-1+l.length)%l.length]); }

  // ---- inline YouTube IFrame pane (full song; alternative to the iTunes preview) ----
  let ytPlayer=null, ytApiReady=false, ytPending=null;
  window.onYouTubeIframeAPIReady=function(){ ytApiReady=true; if(ytPending){ const p=ytPending; ytPending=null; mountYouTube(p.i,p.slot); } };
  function openYouTube(i){
    if(!audio.paused) audio.pause();
    if(ytOpen===i){ closeYouTube(); render(); return; }
    ytOpen=i; render();                       // render injects the slot; mount runs after
  }
  function closeYouTube(){ if(ytPlayer){ try{ytPlayer.destroy();}catch(e){} ytPlayer=null; } ytOpen=-1; }
  function mountYouTube(i, slot){
    const s=songs[i]; if(!s.yt) return;
    slot.innerHTML='<div class="ytbox"><div id="ytframe"></div><div class="ythint">▲ zuklappen</div></div>';
    slot.querySelector(".ythint").onclick=()=>{ closeYouTube(); render(); };
    if(!ytApiReady){ ytPending={i,slot}; return; }
    if(ytPlayer){ try{ytPlayer.destroy();}catch(e){} ytPlayer=null; }
    ytPlayer=new YT.Player('ytframe',{ width:'320', height:'180', videoId:s.yt,
      playerVars:{ playsinline:1, origin:location.origin, rel:0 },
      events:{ onError:(e)=>{ const c=e.data;
        if(c===101||c===150||c===100||c===5){
          const box=slot.querySelector('.ytbox');
          if(box) box.innerHTML=`<a class="ext" style="display:block;padding:12px" href="https://www.youtube.com/watch?v=${s.yt}" target="_blank" rel="noopener">↗ Embed gesperrt — auf YouTube ansehen</a>`;
        } } }
    });
  }

  // ---- Share: copy/share a link that opens the jukebox and auto-plays this song ----
  function share(i, btn){
    const s=songs[i]; const url=shareUrl(s);
    const done=()=>{ if(btn){ const old=btn.innerHTML; btn.classList.add("ok"); btn.innerHTML="✓ kopiert";
      setTimeout(()=>{ btn.classList.remove("ok"); btn.innerHTML=old; },1400); } };
    if(navigator.share){
      navigator.share({ title:"Gesocks Jukebox — "+s.t, text:s.t+" · "+s.a, url })
        .then(done).catch(()=>{ copy(url, done); });
    } else { copy(url, done); }
  }
  function copy(url, done){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(()=>prompt("Song-Link kopieren:", url));
    } else { prompt("Song-Link kopieren:", url); }
  }

  // audio engine -> UI
  audio.addEventListener("play", ()=>{ $("#pp").innerHTML=PAUSE; render(); });
  audio.addEventListener("pause", ()=>{ $("#pp").innerHTML=PLAY; render(); });
  audio.addEventListener("ended", ()=>{ if(autoplay) next(); });
  // if a source fails to load (e.g. an expired iTunes preview / CORS), don't stall the queue
  audio.addEventListener("error", ()=>{ if(autoplay && cur>=0) next(); });
  audio.addEventListener("timeupdate", ()=>{
    if(audio.duration){ $("#fill").style.width=(audio.currentTime/audio.duration*100)+"%";
      $("#cur").textContent=mmss(audio.currentTime); $("#dur").textContent=mmss(audio.duration); }
  });
  $("#track").onclick=e=>{ if(!audio.duration) return; const r=e.currentTarget.getBoundingClientRect();
    audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audio.duration; };

  // transport + modes
  $("#pp").onclick=toggle; $("#prev").onclick=prev; $("#next").onclick=next;
  $("#auto").onclick=()=>{ autoplay=!autoplay; $("#auto").classList.toggle("on",autoplay); };
  $("#shuf").onclick=()=>{ shuffle=!shuffle; $("#shuf").classList.toggle("on",shuffle); };

  // overflow menu (···) toggle + close on outside click / Escape
  $("#moreBtn").onclick=(e)=>{ e.stopPropagation(); toggleMenu(); };
  document.addEventListener("click",(e)=>{ if(!$("#actMenu").hidden && !e.target.closest(".more")) closeMenu(); });
  document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeMenu(); });

  // search
  $("#q").oninput=e=>{ query=e.target.value; render(); };

  // Zufall toggle — reshuffles each time it's turned ON
  $("#shufOrder").onclick=()=>{ shufOrder=!shufOrder; if(shufOrder) orderIdx=randomOrder();
    $("#shufOrder").classList.toggle("on",shufOrder); render(); };
  // "mit KI" toggle — on = alle Songs inkl. KI; off = KI-Songs raus
  $("#kiTog").onclick=()=>{ inclKI=!inclKI; $("#kiTog").classList.toggle("on",inclKI); render(); };
  // Neu / Bestehend release filters (independent on/off)
  $("#fNeu").onclick=()=>{ fNeu=!fNeu; $("#fNeu").classList.toggle("on",fNeu); render(); };
  $("#fBest").onclick=()=>{ fBest=!fBest; $("#fBest").classList.toggle("on",fBest); render(); };

  // load the YouTube IFrame API (for the inline embedded full-song player)
  (function(){ const s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s); })();

  $("#pp").innerHTML=PLAY;
  render();

  // ?play=<id> — open shared link straight into that song and start it
  (function(){
    const want=new URLSearchParams(location.search).get("play");
    if(!want) return;
    const i=songs.findIndex(s=>s.id.toLowerCase()===want.toLowerCase());
    if(i<0) return;
    // shared link start state: no shuffle, both release filters on, KI included —
    // so the recipient sees the song in the normal FC St. Pauli order, full list.
    shufOrder=false; $("#shufOrder").classList.remove("on");
    inclKI=true;     $("#kiTog").classList.add("on");
    fNeu=true;  $("#fNeu").classList.add("on");
    fBest=true; $("#fBest").classList.add("on");
    render();
    if(src(songs[i])){ playSong(i); }             // native / preview -> plays and centers itself
    else {
      if(songs[i].yt) openYouTube(i);             // external -> open its inline YouTube pane
      const row=[...document.querySelectorAll('.row')].find(r=>r.querySelector(`[data-ext="${i}"]`));
      if(row) row.scrollIntoView({block:"center"});
    }
  })();
</script>
